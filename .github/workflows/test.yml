name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
        langgraph: ['0.6.11', '1.2.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,sqlite]' 'langgraph==${{ matrix.langgraph }}' build
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m pytest -q
      - run: python examples/support_triage.py
      - run: python examples/review_resume.py
      - run: python -m build
